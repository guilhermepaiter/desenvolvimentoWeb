<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    button {
        color: black;
        background-color: lightblue;
        border: 2px black solid;
        border-radius: 10px;
    }

    button:hover {
        background-color: rgb(91, 91, 255);
    }

    .efeito:hover {
        color: aqua;
    }
</style>
<body>
    <h1>Pseudo Class :hover</h1>
    <button type="button">Ora Ora</button>
    <p>Passe o mause pelo botão pra mudar a cor!</p>

    <p class="efeito">Passe o mouse pelo paragrafo!</p>
</body>
</html>
