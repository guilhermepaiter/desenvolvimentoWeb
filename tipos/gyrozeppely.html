<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PseudoClass first-child (even/odd)</title>
</head>
<style>
    li {
        padding: 8px;
    }

    li:nth-child(even) {
        color: red;
        background-color: aqua;
        font-weight: bold;
    }

    li:nth-child(odd) {
        color: green;
        background-color: yellowgreen;
    }
</style>
<body>
    <h1>Pseudo Class :first-child e :last-child</h1>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
        <li>PHP</li>
    </ul>
    <p>O item Par é vermelho e o item Impar é verde</p>
</body>
</html>
