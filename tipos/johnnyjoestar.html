<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PseudoClass first-child and last-child</title>
</head>
<style>
    li:first-child {
        color: red;
    }

    li:last-child {
        color: rgb(0, 255, 21);
    }
</style>
<body>
    <h1>Pseudo Class :first-child e :last-child</h1>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <p>O primeiro item é vermelho e o último item é verde</p>
</body>
</html>
